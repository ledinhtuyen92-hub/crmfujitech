services:
  db:
    image: pgvector/pgvector:pg15
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_web
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secure_password_change_me}@db:5432/${DB_NAME:-crm_db}
      - REDIS_URL=redis://redis:6379/0
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network
    env_file:
      - .env

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_celery
    restart: unless-stopped
    command: celery -A core worker -l info
    # Ghi đè HEALTHCHECK của Dockerfile (nó gọi localhost:8000 — container này không chạy web server)
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME -t 10 > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secure_password_change_me}@db:5432/${DB_NAME:-crm_db}
      - REDIS_URL=redis://redis:6379/0
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network
    env_file:
      - .env

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    # Ghi đè HEALTHCHECK của Dockerfile (nó gọi localhost:8000 — container này không chạy web server).
    # Beat sync file schedule mỗi 180s → mtime quá 600s nghĩa là beat đã chết.
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/celerybeat-schedule && [ $$(( $$(date +%s) - $$(stat -c %Y /app/celerybeat-schedule) )) -lt 600 ] || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secure_password_change_me}@db:5432/${DB_NAME:-crm_db}
      - REDIS_URL=redis://redis:6379/1
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - web
    networks:
      - crm_network
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

volumes:
  postgres_data:
  redis_data:

networks:
  crm_network:
    driver: bridge
